name: blind_assist
description: 盲人辅助导航APP - 通过双耳立体声感知周围环境（蝙蝠回声定位原理）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 摄像头实时预览与图像采集
  camera: ^0.11.0

  # TensorFlow Lite 推理引擎（离线AI深度估计）
  tflite_flutter: ^0.11.0

  # Android 权限管理（摄像头、麦克风、存储）
  permission_handler: ^11.3.1

  # 设置持久化（保存用户的参数偏好）
  shared_preferences: ^2.2.3

  # 图像处理（像素操作、缩放、转换）
  image: ^4.2.0

  # 实时低延迟音频合成（生成立体声PCM数据并输出）
  flutter_soloud: ^2.8.0

  # 屏幕方向控制（锁定竖屏）
  orientation: ^2.0.0

  # 路径管理（获取应用文件目录）
  path_provider: ^2.1.4

  # 文件操作
  path: ^1.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
